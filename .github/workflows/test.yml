name: Testy

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/setup-node@v7
      - uses: actions/checkout@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
